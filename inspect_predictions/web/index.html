<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车辆状态与接触证据</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><p class="eyebrow">CARLA · LOCAL REPLAY</p><h1>车辆状态与接触证据</h1><p>从数值姿态检查几何、运动与失败边界</p></div><span id="badge">正在读取</span></header>
<main><section class="controls"><label>案例 <select id="case"><option value="11">11 · 未接触负例 / 013</option><option value="07">07 · 接触正例 / 014</option></select></label><label>结果 <select id="method"><option value="prediction">最新候选</option><option value="baseline">历史过滤基线</option><option value="reference">参考真值（仅评价）</option></select></label><label class="file">打开推理产出的 world.json <input id="upload" type="file" accept=".json"></label></section>
<section class="timeline"><button id="play">播放</button><input id="frame" type="range" min="0" max="79" value="0"><output id="time"></output></section>
<section class="grid"><article><h2>三维姿态示意</h2><canvas id="scene" width="1000" height="620" aria-label="可旋转三维车体框"></canvas><p class="hint">拖动旋转，滚轮缩放。蓝/橙为双车，绿色虚线为评价真值。图中是数学包围盒，不是原资产表面；接触数值来自冻结的原结果。</p></article><article><h2>当前帧的证据</h2><div id="pair"></div><div id="metrics"></div><h2>速度误差分布</h2><p class="hint">红格表示任一车辆速度误差 &gt; 0.3 m/s；灰格表示首帧无相邻速度。点击跳帧。</p><div id="strip"></div><div class="notice">07仍保留第19、33帧速度红格。两段80帧的几何接触回放不能证明真实事故识别或泛化能力。参考真值与预测分开保存，网页不运行感知模型。</div></article></section><details><summary>来源与验证范围</summary><pre id="provenance"></pre></details></main><script src="app.js"></script></body></html>
